<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Say Hello</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <nav class="navbar">
      <ul>
        <li><a href="#">Portfolio</a></li>
        <li><a href="#">Blog</a></li>
        <li><a href="#" class="active">About</a></li>
      </ul>
      <div class="icons">
        <img src="https://cdn-icons-png.flaticon.com/512/1827/1827933.png" alt="settings" class="icon">
        <img src="https://cdn-icons-png.flaticon.com/512/1827/1827956.png" alt="grid" class="icon">
      </div>
    </nav>

    <div class="center-content">
      <div class="avatar">
        <img src="avatar1.jpg" alt="avatar" />
      </div>
      <div class="text-block">
        <h1>Say hello!</h1>
        <p>I’d love to hear from you and always<br>
        welcome any feedback – please don’t<br>
        hesitate to get in touch!</p>
        <button>Say hey!</button>
      </div>
    </div>

    <div class="scroll-top">
      <img src="https://cdn-icons-png.flaticon.com/512/1828/1828859.png" alt="up-arrow" class="icon up-icon">
    </div>
  </div>
</body>
</html>
